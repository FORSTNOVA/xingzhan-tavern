plugins { id 'com.android.application' }
tasks.register('packSynthesis', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', rootProject.file('scripts/pack-synthesis.mjs').absolutePath
    inputs.dir rootProject.file('plugins/xingzhan-synthesis')
    inputs.file rootProject.file('scripts/pack-synthesis.mjs')
    outputs.files(['manifest.json','index.js','media.js','style.css','system.js','kokoro-blend.js','mascot.js','mascot.png'].collect { rootProject.file('app/src/main/assets/xingzhan-synthesis-' + it) })
    outputs.file rootProject.file('artifacts/xingzhan-synthesis.zip')
}
tasks.register('packTavern', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', rootProject.file('scripts/pack-tavern.mjs').absolutePath
    inputs.dir rootProject.file('vendor/SillyTavern')
    inputs.file rootProject.file('scripts/pack-tavern.mjs')
    outputs.files rootProject.file('app/src/main/assets/tavern.zip'),
            rootProject.file('app/src/main/assets/android-characters.js'),
            rootProject.file('app/src/main/assets/android-characters.version')
}
def localDreamApk = project.findProperty('localDreamApk')
        ? rootProject.file(project.property('localDreamApk').toString())
        : rootProject.file('tools/local-sd/localdream-validation/LocalDream_armv8a_2.8.1.apk')
def localDreamCore = rootProject.file('app/build/generated/localdream/jniLibs/arm64-v8a/libstable_diffusion_core.so')
tasks.register('extractLocalDreamNpuCore') {
    inputs.file(localDreamApk).optional()
    outputs.file(localDreamCore)
    onlyIf { localDreamApk.isFile() }
    doLast {
        def entryName = 'lib/arm64-v8a/libstable_diffusion_core.so'
        def extractionRoot = rootProject.file('app/build/generated/localdream/extracted')
        ant.unzip(src: localDreamApk, dest: extractionRoot, overwrite: true) {
            patternset { include(name: entryName) }
        }
        def extracted = new File(extractionRoot, entryName)
        if (!extracted.isFile() || extracted.length() == 0) throw new GradleException("Local Dream APK is missing ${entryName}")
        localDreamCore.parentFile.mkdirs()
        copy {
            from extracted
            into localDreamCore.parentFile
            rename { localDreamCore.name }
        }
        logger.lifecycle("Extracted Local Dream ${extracted.length()} byte native helper into generated jniLibs")
    }
}
tasks.named('preBuild').configure { dependsOn 'packSynthesis', 'packTavern', 'extractLocalDreamNpuCore' }
android {
    namespace 'cn.jiuguan.probe'
    compileSdk 36
    ndkVersion '27.2.12479018'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'cn.jiuguan.probe'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2-probe'
        buildConfigField 'boolean', 'WAKELOCK_PROBE', (project.findProperty('probeWakeLock') ?: 'false').toString()
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'boolean', 'LOCAL_NPU_ENGINE_PROBE', (project.findProperty('localNpuEngineProbe') ?: 'false').toString()
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['../runtime/node24/bin', 'build/generated/localdream/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
