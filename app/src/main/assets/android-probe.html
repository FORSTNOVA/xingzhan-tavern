<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安卓功能验证</title>
<style>body{font:16px sans-serif;background:#211f1c;color:#e8e1d6;padding:16px}button,a{display:block;padding:12px;margin:8px 0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}video{max-width:100%}</style>
<h2>安卓功能验证</h2><p>独立本地测试，不调用模型。文件和传感器操作由系统弹窗确认。</p>
<input id="single" type="file" accept=".png,.json,.charx"><input id="multiple" type="file" multiple>
<button id="json">保存测试 JSON</button><button id="png">保存测试图片</button><button id="clipboard">复制测试文字</button>
<a id="external" href="https://docs.sillytavern.app/" target="_blank" rel="noopener">打开官方说明</a>
<button id="audio">播放本地测试音</button><button id="video">播放合成测试视频</button><button id="fullscreen">视频全屏</button><button id="confirm">验证取消对话框</button><button id="microphone">请求麦克风</button><button id="camera">请求摄像头预览</button><button id="stop">停止录音和预览</button>
<video id="preview" autoplay muted playsinline controls></video><pre id="result"></pre><a href="/">返回酒馆</a>
<script>
window.__androidProbe={};let stream;function record(name,value){window.__androidProbe[name]=value;document.querySelector('#result').textContent=JSON.stringify(window.__androidProbe,null,2)}
for(const id of ['single','multiple'])document.querySelector('#'+id).onchange=e=>record(id,[...e.target.files].map(f=>({name:f.name,size:f.size,type:f.type})));
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);record('exportRequested',name)}
document.querySelector('#json').onclick=()=>download(new Blob([JSON.stringify({androidExport:true,text:'中文保存验证'})],{type:'application/json'}),'酒馆验证.json');
document.querySelector('#png').onclick=()=>{const c=document.createElement('canvas');c.width=c.height=64;c.getContext('2d').fillRect(0,0,64,64);c.toBlob(b=>download(b,'酒馆验证.png'))};
document.querySelector('#clipboard').onclick=async()=>{try{await navigator.clipboard.writeText('酒馆安卓剪贴板验证');record('clipboard',true)}catch(e){record('clipboard',e.name)}};
document.querySelector('#audio').onclick=async()=>{try{const c=new AudioContext();await c.resume();const o=c.createOscillator();const gain=c.createGain();gain.gain.value=.015;o.frequency.value=440;o.connect(gain).connect(c.destination);o.start();o.stop(c.currentTime+.2);record('audio',c.state);setTimeout(()=>c.close(),500)}catch(e){record('audio',e.name)}};

document.querySelector('#fullscreen').onclick=async()=>{try{await document.querySelector('#preview').requestFullscreen();record('fullscreen',true)}catch(e){record('fullscreen',e.name)}};
document.querySelector('#confirm').onclick=()=>record('confirm',confirm('此项只验证取消，没有其他操作'));
for(const type of ['microphone','camera'])document.querySelector('#'+type).onclick=async()=>{try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia(type==='camera'?{video:{facingMode:'environment'},audio:false}:{audio:true,video:false});document.querySelector('#preview').srcObject=stream;record(type,stream.getTracks().map(t=>({kind:t.kind,state:t.readyState})));setTimeout(()=>{stream?.getTracks().forEach(t=>t.stop());record('autoStopped',true)},5000)}catch(e){record(type,e.name)}};
document.querySelector('#stop').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());document.querySelector('#preview').srcObject=null;record('stopped',true)};
</script>
